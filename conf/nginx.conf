upstream django_backend {
    server web:8000;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=django_cache:10m max_size=100m inactive=60m;

server {
    listen 80;
    server_name localhost;
    gzip on;
    gzip_types text/plain text/css application/javascript image/jpeg image/png image/gif image/svg+xml;
    gzip_min_length 1;

    location /uploads/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache django_cache;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
