{% load static %}

<a href="{% url 'questions:question' answer.id %}#answer-1" class="list-group-item list-group-item-action py-3">
    <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
            <h6 class="mb-1">Как подключить Bootstrap локально? {{answer.title}}</h6>
            <small class="text-muted">
                Нужно скачать файлы и подключить через link/script... {{answer.text}}
            </small>
            <br>
            <small class="text-muted">
                {{answer.data}} {{answer.time}}
                <span class="badge bg-success ms-2">✓</span>
            </small>
        </div>
        <span class="badge bg-primary">
            {{answer.likes_cnt}}
            <img src="{% static 'core/img/like_icon.png' %}" alt="Лайк" width="20" height="14">
        </span>
    </div>
</a>
