<html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | ITProger Forum</title>
    <!-- <link rel="icon" href="static/img/icon" type="image/x-icon"> -->

    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/css/mystyle.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            background: #fff;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header class="bg-light border-bottom py-3">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="base.html" class="text-decoration-none d-flex align-items-center gap-2">
                    <!-- <img src="static/img/icon" alt="Logo" width="32" height="32"> -->
                    <span class="fs-5 fw-bold text-dark">ItProger Forum</span>
                </a>
                <a href="signup.html" class="btn btn-primary btn-sm">Регистрация</a>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 text-center mb-4">Вход в аккаунт</h1>

                            <div class="mb-3">
                                <label for="id_email" class="form-label fw-bold">
                                    Email <span class="text-danger">*</span>
                                </label>
                                <input type="email" class="form-control" id="id_email" name="email"
                                    placeholder="xixi@example.com" value="" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="id_password" class="form-label fw-bold">
                                    Пароль <span class="text-danger">*</span>
                                </label>
                                <input type="password" class="form-control" id="id_password" name="password"
                                    placeholder="••••••" autocomplete="current-password" required>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="id_remember" name="remember">
                                <label class="form-check-label" for="id_remember">
                                    Запомнить меня
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                Войти
                            </button>

                        <div class="text-center">
                            <p class="mb-2 text-muted">
                                <a href="#" class="text-decoration-none">
                                    Забыли пароль?
                                </a>
                            </p>
                            <p class="mb-0 text-muted">
                                Нет аккаунта?
                                <a href="signup.html" class="text-decoration-none fw-bold">
                                    Зарегистрироваться
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 ItProger Forum</small>
        </div>
    </footer>

    <script src="static/js/bootstrap.bundle.min.js"></script>

</body>
</html>
